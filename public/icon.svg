<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="flag-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#74acdf" />
      <stop offset="100%" stop-color="#5fa0d9" />
    </linearGradient>
    <linearGradient id="flag-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#feca57" />
      <stop offset="100%" stop-color="#ff9f43" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- TV Outer Frame/Stand -->
  <g transform="translate(16, 0)">
    <!-- Base -->
    <path d="M 200 410 L 280 410" stroke="#74acdf" stroke-width="18" stroke-linecap="round" />
    <!-- Neck -->
    <path d="M 240 350 L 240 410" stroke="#74acdf" stroke-width="26" stroke-linecap="round" />
    
    <!-- TV Cabinet/Body -->
    <rect x="70" y="110" width="340" height="240" rx="40" fill="#0b1329" stroke="#1e293b" stroke-width="12" />
    <rect x="70" y="110" width="340" height="240" rx="40" fill="none" stroke="#74acdf" stroke-width="4" opacity="0.6" />

    <!-- Screen Area (Argentine Flag) -->
    <g>
      <clipPath id="screen-clip">
        <rect x="86" y="126" width="308" height="208" rx="26" />
      </clipPath>
      <g clip-path="url(#screen-clip)">
        <!-- Top Sky Blue Stripe -->
        <rect x="86" y="126" width="308" height="70" fill="url(#flag-top)" />
        <!-- Middle White Stripe -->
        <rect x="86" y="196" width="308" height="68" fill="#ffffff" />
        <!-- Bottom Sky Blue Stripe -->
        <rect x="86" y="264" width="308" height="70" fill="url(#flag-top)" />

        <!-- Sun of May (El Sol de Mayo) in center -->
        <circle cx="240" cy="230" r="22" fill="url(#flag-sun)" filter="url(#glow)" />
        <circle cx="240" cy="230" r="14" fill="#f1a91d" opacity="0.5" />
        <!-- Sun Rays -->
        <path d="M 240 198 L 240 262 M 208 230 L 272 230 M 217 207 L 263 253 M 217 253 L 263 207" stroke="#e67e22" stroke-width="4.5" stroke-linecap="round" />
        <circle cx="240" cy="230" r="11" fill="url(#flag-sun)" />

        <!-- Play Icon overlay (Modern Semi-transparent glassmorphism play triangle) -->
        <polygon points="225,200 270,230 225,260" fill="#ffffff" filter="url(#glow)" />
        <polygon points="225,200 270,230 225,260" fill="#ffffff" />
      </g>
    </g>

    <!-- TV Antennas for retro TDA style -->
    <path d="M 180 110 L 110 40" stroke="#64748b" stroke-width="10" stroke-linecap="round" />
    <circle cx="110" cy="40" r="10" fill="#74acdf" />
    
    <path d="M 300 110 L 370 40" stroke="#64748b" stroke-width="10" stroke-linecap="round" />
    <circle cx="370" cy="40" r="10" fill="#74acdf" />
  </g>
</svg>
